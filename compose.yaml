services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: university_match
      POSTGRES_USER: university_match
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university_match -d university_match"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
